<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <header>
        <div class="flex md:px-[15%] bg-gray-50 text-gray-600 justify-between py-2">
            <div>
                Super Value Deals - Save more with coupons
            </div>
            <div class="flex space-x-2 hover:text-green-500">
                <img src="./assets/images/Flag_of_the_United_Kingdom.svg" alt="Flag of United Kingdom" class="w-[2rem]">
                English
                <i class="ri-arrow-down-s-line"></i>
            </div>
        </div>
        <nav class="flex flex-cols md:px-[15%] py-4">
            <div class="flex w-full justify-between space-x-4">
                <img class="w-1/5" src="https://themewagon.github.io/freshcart/assets/images/logo/freshcart-logo.svg" alt="FreshCart Logo">
                <div class="flex w-2/5 relative items-center">
                    <input type="text" name="search" id="search" placeholder="Search for products" class="w-full px-4 h-full rounded-md border border-gray-300">
                    <button class="absolute right-5 text-gray-600">
                        <i class="ri-search-line"></i>
                    </button>
                </div>
                <div class="w-1/5">
                    <button class="flex rounded-md border border-gray-300 space-x-2 text-gray-600 px-4 py-2">
                        <i class="ri-map-pin-line"></i>
                        Location
                    </button>
                </div>
                <div class="flex w-1/5 text-[1.5rem] space-x-6 justify-end text-gray-600">
                    <i class="ri-poker-hearts-line relative">
                        <div class="flex absolute bottom-6 left-3 bg-green-500 rounded-[1rem] text-sm w-[1.2rem] h-[1.2rem] justify-center items-center text-white">
                            5
                        </div>
                    </i>
                    <i class="ri-user-line"></i>
                    <i class="ri-handbag-line"></i>
                </div>
            </div>
            <div>

            </div>
        </nav>
    </header>
    <main>

    </main>
    <footer>

    </footer>
</body>
</html>
